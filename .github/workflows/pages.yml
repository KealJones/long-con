# Deploys the web chat (apps/web) on every push to main, by publishing it to the gh-pages branch
# (Settings > Pages > Source: "Deploy from a branch", gh-pages, / (root)).
# Pull-request previews (pr-preview.yml) live on the same branch under pr-preview/, which this deploy leaves alone.
name: Web chat (Pages)

on:
  push:
    branches: [main]
    paths: [apps/web/**, packages/core/**, package-lock.json, .github/workflows/pages.yml]
  workflow_dispatch:

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @beep/web
      - name: Publish to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: apps/web/dist
          branch: gh-pages
          clean: true
          clean-exclude: pr-preview/
          commit-message: "Deploy ${{ github.sha }}"

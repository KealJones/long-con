<!doctype html>
<html lang="en">
  <head>

    <header>
      <h1>Long Con</h1>
      <details id="settings">
        <summary>Settings</summary>
        <label>Anthropic API key <input id="key" type="password" autocomplete="off" placeholder="sk-ant-..." /></label>

      </div>
    </form>

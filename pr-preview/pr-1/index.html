<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)" />
    <title>Long Con</title>
    <script type="module" crossorigin src="./assets/index-BLANAJ03.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-De5XWktN.css">
  </head>
  <body>
    <div class="app">
      <aside id="sidebar" class="sidebar" aria-label="Topics and data">
        <div class="side-head">
          <div class="tabs" role="tablist">
            <button role="tab" id="tab-topics" aria-selected="true" aria-controls="panel-topics">Topics</button>
            <button role="tab" id="tab-data" aria-selected="false" aria-controls="panel-data">Data</button>
          </div>
          <button class="icon only-narrow" id="close-side" aria-label="Close sidebar">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </div>

        <section id="panel-topics" role="tabpanel" aria-labelledby="tab-topics">
          <input id="search" type="search" placeholder="Search everything you've said" aria-label="Search the chat" />
          <ol id="results" class="results"></ol>
          <h2>What you talk about</h2>
          <div id="topics" class="chips"></div>
        </section>

        <section id="panel-data" role="tabpanel" aria-labelledby="tab-data" hidden>
          <div id="stats" class="stats"></div>
          <h2>Days</h2>
          <ol id="days" class="days"></ol>
          <div class="data-actions">
            <button id="export" type="button">Export</button>
            <label class="button">Import <input id="import" type="file" accept="application/json" hidden /></label>
            <button id="clear" type="button" class="danger">Delete everything</button>
          </div>
          <p class="hint">All of this lives in this browser, plus your GitHub repo if you pick one in Settings.</p>
        </section>
      </aside>
      <div id="scrim" class="scrim" hidden></div>

      <div class="chat">
        <header class="bar">
          <button class="icon" id="open-side" aria-label="Show topics and data" aria-expanded="false" aria-controls="sidebar">
            <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
          </button>
          <div class="who">
            <div class="avatar" aria-hidden="true">LC</div>
            <div>
              <div class="name">Long Con</div>
              <div id="presence" class="presence">remembers everything</div>
            </div>
          </div>
          <button class="icon" id="open-settings" aria-label="Settings">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" /></svg>
          </button>
        </header>

        <main id="log" class="log" aria-live="polite"></main>

        <form id="form" class="composer">
          <p id="status" class="status" role="status"></p>
          <div class="pill">
            <textarea id="input" rows="1" placeholder="Text Long Con" aria-label="Message"></textarea>
            <button id="send" type="submit" aria-label="Send" disabled>
              <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7" /></svg>
            </button>
          </div>
        </form>
      </div>
    </div>

    <dialog id="settings" aria-labelledby="settings-title">
      <form method="dialog">
        <h2 id="settings-title">Settings</h2>
        <label>Anthropic API key
          <span class="key-row">
            <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-..." />
            <button type="button" id="show-key" aria-pressed="false">Show</button>
          </span>
        </label>
        <p class="hint">Stays in this browser and goes only to api.anthropic.com.</p>
        <label>Model <select id="model"></select></label>
        <h3>Save to GitHub</h3>
        <div id="gh" aria-live="polite"></div>
        <div class="dialog-actions"><button value="close" class="primary">Done</button></div>
      </form>
    </dialog>

  </body>
</html>
